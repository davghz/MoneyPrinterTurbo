[app]
video_source = "pexels" # "pexels" or "pixabay"

# Whether to hide the configuration panel
hide_config = false

# Pexels API Key
# Register at https://www.pexels.com/api/ to get your API key.
# You can use multiple keys to avoid rate limits.
# For example: pexels_api_keys = ["123adsf4567adf89","abd1321cd13efgfdfhi"]
# Note on format: Keys should be enclosed in English double quotes, multiple keys separated by commas.
pexels_api_keys = []

# Pixabay API Key
# Register at https://pixabay.com/api/docs/ to get your API key.
# You can use multiple keys to avoid rate limits.
# For example: pixabay_api_keys = ["123adsf4567adf89","abd1321cd13efgfdfhi"]
# Note on format: Keys should be enclosed in English double quotes, multiple keys separated by commas.
pixabay_api_keys = []

# Supported LLM providers:
#   openai
#   moonshot    (Moonshot AI - Kimi)
#   azure
#   qwen        (Alibaba Tongyi Qianwen)
#   deepseek
#   gemini
#   ollama
#   g4f
#   oneapi
#   cloudflare
#   ernie       (Baidu Wenxin Yiyan)
llm_provider = "openai"

########## Pollinations AI Settings
# Visit https://pollinations.ai/ to learn more
# API Key is optional - leave empty for public access
pollinations_api_key = ""
# Default base URL for Pollinations API
pollinations_base_url = "https://pollinations.ai/api/v1"
# Default model for text generation
pollinations_model_name = "openai-fast"

########## Ollama Settings
# No need to set it unless you want to use your own proxy
ollama_base_url = ""
# Check your available models at https://ollama.com/library
ollama_model_name = ""

########## OpenAI API Key
# Get your API key at https://platform.openai.com/api-keys
openai_api_key = ""
# No need to set it unless you want to use your own proxy
openai_base_url = ""
# Check your available models at https://platform.openai.com/account/limits
openai_model_name = "gpt-4o-mini"

########## Moonshot API Key
# Visit https://platform.moonshot.cn/console/api-keys to get your API key.
moonshot_api_key = ""
moonshot_base_url = "https://api.moonshot.cn/v1"
moonshot_model_name = "moonshot-v1-8k"

########## OneAPI API Key
# Visit https://github.com/songquanpeng/one-api to get your API key
oneapi_api_key = ""
oneapi_base_url = ""
oneapi_model_name = ""

########## G4F
# Visit https://github.com/xtekky/gpt4free to get more details
# Supported model list: https://github.com/xtekky/gpt4free/blob/main/g4f/models.py
g4f_model_name = "gpt-3.5-turbo"

########## Azure API Key
# Visit https://learn.microsoft.com/zh-cn/azure/ai-services/openai/ to get more details
# API documentation: https://learn.microsoft.com/zh-cn/azure/ai-services/openai/reference
azure_api_key = ""
azure_base_url = ""
azure_model_name = "gpt-35-turbo"        # replace with your model deployment name
azure_api_version = "2024-02-15-preview"

########## Gemini API Key
gemini_api_key = ""
gemini_model_name = "gemini-1.0-pro"

########## Qwen API Key
# Visit https://dashscope.console.aliyun.com/apiKey to get your API key
# Visit below links to get more details
# https://tongyi.aliyun.com/qianwen/
# https://help.aliyun.com/zh/dashscope/developer-reference/model-introduction
qwen_api_key = ""
qwen_model_name = "qwen-max"


########## DeepSeek API Key
# Visit https://platform.deepseek.com/api_keys to get your API key
deepseek_api_key = ""
deepseek_base_url = "https://api.deepseek.com"
deepseek_model_name = "deepseek-chat"

# Subtitle Provider, "edge" or "whisper"
# If empty, the subtitle will not be generated
subtitle_provider = "edge"

#
# ImageMagick
#
# Once you have installed it, ImageMagick will be automatically detected, except on Windows!
# On Windows, for example "C:\Program Files (x86)\ImageMagick-7.1.1-Q16-HDRI\magick.exe"
# Download from https://imagemagick.org/archive/binaries/ImageMagick-7.1.1-29-Q16-x64-static.exe

# imagemagick_path = "C:\\Program Files (x86)\\ImageMagick-7.1.1-Q16\\magick.exe"


#
# FFMPEG
#
# Normally, ffmpeg is automatically downloaded and detected.
# However, if your environment has issues preventing automatic download, you might encounter errors like:
#   RuntimeError: No ffmpeg exe could be found.
#   Install ffmpeg on your system, or set the IMAGEIO_FFMPEG_EXE environment variable.
# In such cases, you can manually download ffmpeg from https://www.gyan.dev/ffmpeg/builds/ and set the ffmpeg_path.

# Under normal circumstances, ffmpeg is downloaded automatically and detected automatically.
# However, if there is an issue with your environment that prevents automatic downloading, you might encounter the following error:
#   RuntimeError: No ffmpeg exe could be found.
#   Install ffmpeg on your system, or set the IMAGEIO_FFMPEG_EXE environment variable.
# In such cases, you can manually download ffmpeg and set the ffmpeg_path, download link: https://www.gyan.dev/ffmpeg/builds/

# ffmpeg_path = "C:\\Users\\harry\\Downloads\\ffmpeg.exe" # Example for Windows
#########################################################################################

# When a video is successfully generated, the API service provides a download endpoint.
# By default, this is the service's current address and listening port.
# Example: http://127.0.0.1:8080/tasks/6357f542-a4e1-46a1-b4c9-bf3bd0df5285/final-1.mp4
# If you provide the service externally using a domain name (e.g., with nginx as a proxy),
# you can set your domain name here.
# Example: https://xxxx.com/tasks/6357f542-a4e1-46a1-b4c9-bf3bd0df5285/final-1.mp4
# endpoint="https://xxxx.com"
endpoint = ""


# Video material storage location
# material_directory = ""  # Default: ./storage/cache_videos under the current project
# material_directory = "/user/harry/videos"  # Download to a specified folder
# material_directory = "task"  # Download to the current task's folder (no sharing of materials)

# Video material storage location
# material_directory = ""  # Default: video materials will be downloaded to ./storage/cache_videos
# material_directory = "/user/harry/videos"  # Download video materials to a specified folder
# material_directory = "task"  # Download video materials to the current task's folder; this prevents sharing of downloaded materials.

material_directory = ""

# Used for state management of the task
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

# Maximum number of concurrent video generation tasks
max_concurrent_tasks = 5


[whisper]
# Only effective when subtitle_provider is "whisper"

# Run on GPU with FP16
# model = WhisperModel(model_size, device="cuda", compute_type="float16")

# Run on GPU with INT8
# model = WhisperModel(model_size, device="cuda", compute_type="int8_float16")

# Run on CPU with INT8
# model = WhisperModel(model_size, device="cpu", compute_type="int8")

# recommended model_size: "large-v3"
model_size = "large-v3"
# if you want to use GPU, set device="cuda"
device = "CPU"
compute_type = "int8"


[proxy]
### Use a proxy to access the Pexels API
### Format: "http://<username>:<password>@<proxy>:<port>"
### Example: "http://user:pass@proxy:1234"
### Doc: https://requests.readthedocs.io/en/latest/user/advanced/#proxies

# http = "http://10.10.1.10:3128"
# https = "http://10.10.1.10:1080"

[azure]
# Azure Speech API Key
# Get your API key at https://portal.azure.com/#view/Microsoft_Azure_ProjectOxford/CognitiveServicesHub/~/SpeechServices
speech_key = ""
speech_region = ""

[siliconflow]
# SiliconFlow API Key
# Get your API key at https://siliconflow.cn
api_key = ""

[google_tts]
# Optional: Path to your Google Cloud service account JSON key file.
# If not provided, Application Default Credentials (ADC) will be used.
# This can also be set via the GOOGLE_APPLICATION_CREDENTIALS environment variable.
# service_account_key_path = "/path/to/your/service-account-file.json"

# Default language code for Google TTS (e.g., "en-US")
# Environment variable: GOOGLE_TTS_LANGUAGE_CODE
default_language_code = "en-US"

# Default voice name for Google TTS (e.g., "en-US-Wavenet-D")
# Environment variable: GOOGLE_TTS_VOICE_NAME
default_voice_name = "en-US-Wavenet-D"

# Default audio encoding ("MP3", "LINEAR16", "OGG_OPUS", etc.)
# Refer to https://cloud.google.com/text-to-speech/docs/reference/rest/v1/text/synthesize#audioencoding
# Environment variable: GOOGLE_TTS_AUDIO_ENCODING
default_audio_encoding = "MP3"

[ui]
# UI related settings
# Whether to hide log messages in the UI
hide_log = false

[streaming]
# Optional: YouTube Data API v3 key (limited functionality, primarily for public data)
# Environment variable: YOUTUBE_API_KEY
# youtube_api_key = "YOUR_YOUTUBE_API_KEY"

# Optional: Path to YouTube client_secret.json for OAuth 2.0 (for user-specific actions)
# Environment variable: YOUTUBE_CLIENT_SECRETS_FILE
# youtube_client_secrets_file = "/path/to/client_secret.json"

# Optional: Path to stored YouTube OAuth 2.0 credentials file (generated after successful auth)
# Environment variable: YOUTUBE_CREDENTIALS_FILE
# youtube_credentials_file = "/path/to/youtube_credentials.json"

# Optional: Default YouTube Live Stream ID (if you have a specific, persistent one)
# This is used by StreamingOrchestrator to check YouTube's stream status.
# Environment variable: YOUTUBE_LIVE_STREAM_ID
# youtube_live_stream_id = "YOUR_YOUTUBE_LIVE_STREAM_ID"

# Target RTMP Ingest URL (e.g., for Google Cloud Media CDN, YouTube Live, Twitch)
# Example for Media CDN: "rtmp://your-media-cdn-endpoint/live"
# Example for YouTube: "rtmp://a.rtmp.youtube.com/live2"
# Environment variable: MEDIA_CDN_RTMP_URL
media_cdn_rtmp_url = "rtmp://localhost/live" # Default to a local server for testing

# Stream Key for the target RTMP server (e.g., YouTube Stream Key, Media CDN Stream Key)
# Environment variable: MEDIA_CDN_STREAM_KEY
media_cdn_stream_key = "test_stream_key"

# Default video resolution for streaming
# Environment variable: STREAMING_DEFAULT_RESOLUTION
default_resolution = "1920x1080"

# Default Frames Per Second (FPS) for streaming
# Environment variable: STREAMING_DEFAULT_FPS
default_fps = 30

# Default video bitrate for streaming (e.g., "4500k", "6M")
# Environment variable: STREAMING_DEFAULT_VIDEO_BITRATE
default_video_bitrate = "4500k"

# Default audio bitrate for streaming (e.g., "128k", "192k")
# Environment variable: STREAMING_DEFAULT_AUDIO_BITRATE
default_audio_bitrate = "128k"

# Default FFmpeg input source. This can be a test pattern, a placeholder video file,
# or a specific device/capture method.
# Example for a test pattern (streams for 1 hour): "lavfi:testsrc=size=1920x1080:rate=30:duration=3600"
# Example for a local file: "/path/to/your/placeholder_video.mp4" (ensure FFmpeg has access)
# Environment variable: STREAMING_FFMPEG_INPUT_SOURCE
ffmpeg_input_source = "lavfi:testsrc=size=1920x1080:rate=30:duration=3600"

# Optional: Full path to the FFmpeg executable (if not in system PATH or to use a specific version)
# Environment variable: FFMPEG_PATH
# ffmpeg_path = "/usr/bin/ffmpeg"
